name: rewit_mobile
description: "Rede social geográfica de avaliações do mundo físico (lugares, produtos e serviços)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Requisições HTTP e Serialização
  http: ^1.2.2
  http_parser: ^4.1.2

  # Ícones e componentes Cupertino
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  google_sign_in_platform_interface: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
