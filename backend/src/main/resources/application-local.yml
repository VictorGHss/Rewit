spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rewit_db}}
    username: ${POSTGRES_USER:rewit_user}
    password: ${POSTGRES_PASSWORD:rewit_local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Lock de sessão: migrations não transacionais (CREATE INDEX CONCURRENTLY, V16) esperariam
    # a transação do próprio lock transacional do Flyway e nunca terminariam
    postgresql:
      transactional-lock: false

  jpa:
    open-in-view: false
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# Observabilidade local (ADR-012): management na 8081 do base, logs em texto e todas as requisições amostradas
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:}

# Configurações de serviços locais
rewit:
  minio:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:${MINIO_ENDPOINT:http://localhost:8333}}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:rewit_local_access}}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:rewit_local_secret}}
    bucket-name: ${OBJECT_STORAGE_BUCKET:${MINIO_BUCKET_NAME:rewit-local}}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:rewit-api}
    jwt-audience: ${JWT_AUDIENCE:rewit-clients}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
  spatial:
    default-validation-radius-meters: 50
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
