spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rewit_db}}
    username: ${POSTGRES_USER:rewit_user}
    password: ${POSTGRES_PASSWORD:rewit_local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# Configurações de serviços locais
rewit:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:rewit_minio_admin}
    secret-key: ${MINIO_ROOT_PASSWORD:rewit_minio_secret}
    bucket-name: ${MINIO_BUCKET_NAME:rewit-media}
  security:
    jwt-secret: ${JWT_SECRET:super_secret_local_jwt_key_that_is_at_least_32_bytes_long_12345}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  spatial:
    default-validation-radius-meters: 50
