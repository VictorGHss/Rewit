spring:
  application:
    name: rewit-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Observabilidade V1 (ADR-012): métricas por scrape Prometheus, traces HTTP via OTLP, logs JSON no stdout
management:
  # Actuator só na porta de management, que não é publicada externamente (a API segue em server.port)
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  observations:
    enable:
      # Os quatro jobs já têm métricas rewit.* próprias; sem observação, também não há spans de @Scheduled
      '[tasks.scheduled.execution]': false
      # Spans do Spring Security ficam fora do escopo: tracing só de HTTP servidor e cliente
      '[spring.security]': false
      # Comandos Redis do rate limiting (ADR-013) ficam fora do escopo de tracing do ADR-012: sem spans nem métricas
      '[lettuce]': false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # O endpoint OTLP de traces não é declarado aqui: sem MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # nenhum exportador é criado. Logs não são exportados por OTLP.
  logging:
    export:
      otlp:
        enabled: false

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}
    json:
      # Stack trace limitado e sem mensagens de exceção (podem carregar SQL, URLs ou chaves de objeto)
      stacktrace:
        printer: com.rewit.infrastructure.observability.SanitizedStackTracePrinter
        max-length: 8192
        max-throwable-depth: 30

rewit:
  outbox:
    poller-enabled: ${OUTBOX_POLLER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:15000}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    lease-duration: ${OUTBOX_LEASE_DURATION:PT2M}
    error-max-length: ${OUTBOX_ERROR_MAX_LENGTH:512}
    purge-enabled: ${OUTBOX_PURGE_ENABLED:true}
    purge-interval-ms: ${OUTBOX_PURGE_INTERVAL_MS:3600000}
    purge-initial-delay-ms: ${OUTBOX_PURGE_INITIAL_DELAY_MS:60000}
    purge-retention: ${OUTBOX_PURGE_RETENTION:PT720H}
    purge-batch-size: ${OUTBOX_PURGE_BATCH_SIZE:100}
    retry:
      initial-delay: ${OUTBOX_RETRY_INITIAL_DELAY:PT30S}
      multiplier: ${OUTBOX_RETRY_MULTIPLIER:2.0}
      max-delay: ${OUTBOX_RETRY_MAX_DELAY:PT10M}
      max-attempts: ${OUTBOX_RETRY_MAX_ATTEMPTS:5}
  # Cleanup de auth_sessions (Step 29.3, ADR-011): limpa IP/user agent de sessões inativas e remove sessões
  # expiradas sem sucessora de rotação. Sem retenção configurável: a elegibilidade é estrutural.
  auth-session-cleanup:
    enabled: ${AUTH_SESSION_CLEANUP_ENABLED:true}
    interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
    initial-delay-ms: ${AUTH_SESSION_CLEANUP_INITIAL_DELAY_MS:60000}
    batch-size: ${AUTH_SESSION_CLEANUP_BATCH_SIZE:100}
    max-batches-per-run: ${AUTH_SESSION_CLEANUP_MAX_BATCHES_PER_RUN:1}
  # Purge de contas excluídas (C2.3): o e-mail reservado é um HMAC-SHA256 com este segredo (mínimo 32 bytes, estável e
  # igual em todas as instâncias; trocá-lo invalida as reservas já gravadas). Sem ele o purge não executa.
  account:
    email-reservation-secret: ${ACCOUNT_EMAIL_RESERVATION_SECRET:}
  # Rate limiting distribuído (ADR-013): janela deslizante no Redis, chaves derivadas por HMAC, sem limite por IP.
  # RATE_LIMIT_KEY_SECRET é obrigatório com o rate limiting ligado (mínimo 32 bytes) e igual em todas as instâncias.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    key-secret: ${RATE_LIMIT_KEY_SECRET:}
    backend:
      # LOCAL_FALLBACK (limites em memória por instância), DENY ou ALLOW enquanto o Redis estiver indisponível
      failure-mode: ${RATE_LIMIT_BACKEND_FAILURE_MODE:LOCAL_FALLBACK}
      retry-interval: ${RATE_LIMIT_BACKEND_RETRY_INTERVAL:PT10S}
      local-fallback-max-keys: ${RATE_LIMIT_LOCAL_FALLBACK_MAX_KEYS:100000}
    auth:
      # Tentativas sem sucesso por e-mail normalizado
      login:
        limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
        window: ${RATE_LIMIT_LOGIN_WINDOW:PT15M}
      # Rotações de refresh token por usuário
      refresh:
        limit: ${RATE_LIMIT_REFRESH_LIMIT:30}
        window: ${RATE_LIMIT_REFRESH_WINDOW:PT5M}
      # Tentativas de cadastro somadas de todos os clientes
      registration:
        limit: ${RATE_LIMIT_REGISTRATION_LIMIT:30}
        window: ${RATE_LIMIT_REGISTRATION_WINDOW:PT1M}
    content:
      report-creation:
        limit: 10
        window: PT60S
      discussion-creation:
        limit: 15
        window: PT60S
      media-upload:
        limit: 10
        window: PT60S
  # GC de storage (Step 28.5): desligado por padrão. Ao ligar, defina também, sem defaults:
  # interval-ms, page-size, max-pages, max-candidates, max-deletes, grace-period e max-duration
  # (ex.: REWIT_STORAGE_GC_GRACE_PERIOD). O modo destrutivo exige STORAGE_GC_DRY_RUN=false explícito.
  storage-gc:
    enabled: ${STORAGE_GC_ENABLED:false}
    dry-run: ${STORAGE_GC_DRY_RUN:true}
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
      connect-timeout-ms: ${GOOGLE_PLACES_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${GOOGLE_PLACES_READ_TIMEOUT_MS:5000}
