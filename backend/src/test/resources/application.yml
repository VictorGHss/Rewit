# Configuração padrão de testes automatizados
# Exige configuração explícita de infraestrutura isolada de teste (A-1); sem fallback para serviços compartilhados.
spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:postgresql://${TEST_POSTGRES_HOST:127.0.0.1}:${TEST_POSTGRES_PORT:}/${TEST_POSTGRES_DB:rewit_test}}
    username: ${TEST_APP_DB_USER:rewit_app}
    password: ${TEST_APP_DB_PASSWORD:test_app_password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
  flyway:
    user: ${TEST_MIGRATION_DB_USER:${TEST_POSTGRES_USER:rewit_user}}
    password: ${TEST_MIGRATION_DB_PASSWORD:${TEST_POSTGRES_PASSWORD:test_postgres_password}}
    postgresql:
      transactional-lock: false
  data:
    redis:
      host: ${TEST_REDIS_HOST:127.0.0.1}
      port: ${TEST_REDIS_PORT:}
      password: ${TEST_REDIS_PASSWORD:}
      timeout: 3000ms
  jpa:
    open-in-view: false

# Observabilidade V1 (ADR-012): nenhum span é exportado nos testes; os testes de tracing religam a exportação
# para um exportador em memória. Logs ficam em texto e o Actuator no default (só health na porta da aplicação).
management:
  tracing:
    export:
      enabled: false

rewit:
  outbox:
    # Poller desligado em TODOS os testes: o agendador @Scheduled não deve
    # disputar linhas do outbox com testes que seguram locks manualmente.
    poller-enabled: false
    # Purge desligado em TODOS os testes (Step 27.4, Parte T): nenhum DELETE
    # por relógio pode disputar com cenários que semeiam linhas antigas.
    purge-enabled: false
  auth-session-cleanup:
    enabled: false
  storage-gc:
    enabled: false
  rate-limit:
    key-secret: test-rate-limit-key-${random.uuid}
    auth:
      registration:
        limit: 1000000
  account:
    email-reservation-secret: ${random.uuid}${random.uuid}
    purge:
      enabled: false
  minio:
    endpoint: ${TEST_STORAGE_ENDPOINT:}
    access-key: ${TEST_STORAGE_ACCESS_KEY:change-me}
    secret-key: ${TEST_STORAGE_SECRET_KEY:change-me}
    bucket-name: ${TEST_STORAGE_BUCKET:rewit-local}
  security:
    jwt-secret: ${JWT_SECRET:test_jwt_secret_with_sufficient_entropy_and_at_least_32_bytes_length_12345!}
