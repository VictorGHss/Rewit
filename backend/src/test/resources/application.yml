# Configuração padrão de testes automatizados
# Exige configuração explícita de infraestrutura descartável de teste (A-1, A-1b): somente variáveis TEST_*,
# sem valores padrão e sem fallback para variáveis de desenvolvimento. Variável ausente => o contexto não sobe
# (TestInfrastructureSafetyValidator falha antes de qualquer conexão). Ver docs/development/local-setup.md.
spring:
  datasource:
    url: ${TEST_DATASOURCE_URL}
    username: ${TEST_APP_DB_USER}
    password: ${TEST_APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
  flyway:
    url: ${spring.datasource.url}
    user: ${TEST_MIGRATION_DB_USER}
    password: ${TEST_MIGRATION_DB_PASSWORD}
    postgresql:
      transactional-lock: false
  data:
    redis:
      host: ${TEST_REDIS_HOST}
      port: ${TEST_REDIS_PORT}
      password: ${TEST_REDIS_PASSWORD:}
      timeout: 3000ms
  jpa:
    open-in-view: false

# Observabilidade V1 (ADR-012): nenhum span é exportado nos testes; os testes de tracing religam a exportação
# para um exportador em memória. Logs ficam em texto e o Actuator no default (só health na porta da aplicação).
management:
  tracing:
    export:
      enabled: false

rewit:
  datasource:
    media:
      username: ${TEST_MEDIA_DB_USER}
      password: ${TEST_MEDIA_DB_PASSWORD}
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        idle-timeout: 10000
        max-lifetime: 30000
    moderation:
      username: ${TEST_MOD_DB_USER}
      password: ${TEST_MOD_DB_PASSWORD}
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        idle-timeout: 10000
        max-lifetime: 30000
  outbox:
    # Poller desligado em TODOS os testes: o agendador @Scheduled não deve
    # disputar linhas do outbox com testes que seguram locks manualmente.
    poller-enabled: false
    # Purge desligado em TODOS os testes (Step 27.4, Parte T): nenhum DELETE
    # por relógio pode disputar com cenários que semeiam linhas antigas.
    purge-enabled: false
  auth-session-cleanup:
    enabled: false
  storage-gc:
    enabled: false
  rate-limit:
    key-secret: test-rate-limit-key-${random.uuid}
    auth:
      registration:
        limit: 1000000
  account:
    email-reservation-secret: ${random.uuid}${random.uuid}
    purge:
      enabled: false
  minio:
    endpoint: ${TEST_STORAGE_ENDPOINT}
    access-key: ${TEST_STORAGE_ACCESS_KEY}
    secret-key: ${TEST_STORAGE_SECRET_KEY}
    bucket-name: ${TEST_STORAGE_BUCKET}
  security:
    # Segredo fixo de teste: não herda JWT_SECRET do ambiente de desenvolvimento
    jwt-secret: test_jwt_secret_with_sufficient_entropy_and_at_least_32_bytes_length_12345!
    password-pepper: test_password_pepper_secret_with_sufficient_entropy_and_at_least_32_bytes_12345!
    password-pepper-previous: test_previous_pepper_secret_with_sufficient_entropy_at_least_32_bytes!
    password-pepper-key-id: key-2026-b
    password-pepper-previous-key-id: key-2026-a
    refresh-token-secret: test_refresh_token_secret_with_sufficient_entropy_and_at_least_32_bytes_12345!
    refresh-token-secret-previous: test_previous_refresh_secret_with_sufficient_entropy_at_least_32_bytes!
    moderation-audit-secret: test_moderation_audit_secret_with_sufficient_entropy_and_at_least_32_bytes_1!
    moderation-audit-secret-previous: test_previous_moderation_audit_secret_with_sufficient_entropy_32_bytes_0!
    moderation-audit-key-id: mod-key-2026-b
    moderation-audit-previous-key-id: mod-key-2026-a
