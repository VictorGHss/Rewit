# Configuração padrão de testes automatizados
# Define porta do PostgreSQL para 5433 (ou POSTGRES_PORT do ambiente) e um segredo válido de teste
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:rewit_db}}
    username: ${POSTGRES_USER:rewit_user}
    password: ${POSTGRES_PASSWORD:rewit_local_password}
  jpa:
    open-in-view: false

rewit:
  outbox:
    # Poller desligado em TODOS os testes: o agendador @Scheduled não deve
    # disputar linhas do outbox com testes que seguram locks manualmente.
    # O teste da Parte W invoca o poller diretamente (sem relógio real).
    poller-enabled: false
    # Purge desligado em TODOS os testes (Step 27.4, Parte T): nenhum DELETE
    # por relógio pode disputar com cenários que semeiam linhas antigas.
    # O teste da Parte Q invoca o purge diretamente (sem relógio real).
    purge-enabled: false
  minio:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:8333}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:change-me}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:change-me}
    bucket-name: ${OBJECT_STORAGE_BUCKET:rewit-local}
  security:
    jwt-secret: ${JWT_SECRET:test_jwt_secret_with_sufficient_entropy_and_at_least_32_bytes_length_12345!}
