# Exemplo de configuração para o Cloudflare Tunnel (cloudflared)
# Para vincular seu túnel local a um hostname público da Cloudflare:

tunnel: seu-uuid-de-tunel-aqui
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Roteamento da API Spring Boot
  - hostname: api-dev.seu-dominio.com
    service: http://backend:8080
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # Roteamento do Object Storage S3 API (SeaweedFS)
  - hostname: storage-dev.seu-dominio.com
    service: http://seaweedfs:8333

  # Regra de fallback obrigatória
  - service: http_status:404
