# ==============================================================================
# REWIT - ORQUESTRAÇÃO DE INFRAESTRUTURA LOCAL (DOCKER COMPOSE)
# ==============================================================================
# Serviços essenciais para execução local:
# 1. postgres (PostgreSQL 18 + PostGIS 3.6)
# 2. redis (Redis 8)
# 3. seaweedfs (SeaweedFS 4.47 S3 Object Storage - Single Node)
# Profiles opcionais:
# - backend: Execução da API Spring Boot conteinerizada
# - tunnel: Execução do túnel Cloudflare para testes remotos no celular físico
# ==============================================================================

networks:
  rewit-network:
    driver: bridge
    name: rewit-network

volumes:
  postgres_data:
    name: rewit_postgres_data
  redis_data:
    name: rewit_redis_data
  seaweedfs_data:
    name: rewit_seaweedfs_data

services:
  # ----------------------------------------------------------------------------
  # 1. BANCO DE DADOS PRINCIPAL: POSTGRESQL 18 + POSTGIS 3.6
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:18-3.6
    container_name: rewit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rewit-network

  # ----------------------------------------------------------------------------
  # 2. CACHE, SESSÕES E RATE LIMITING: REDIS (Linha 8.x Estável)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: rewit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rewit-network

  # ----------------------------------------------------------------------------
  # 3. ARMAZENAMENTO DE OBJETOS: SEAWEEDFS 4.47 (S3 COMPATIBLE, SINGLE-NODE)
  # ----------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: rewit-seaweedfs
    restart: unless-stopped
    command: mini -dir=/data -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET}
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-8333}:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:9333/cluster/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rewit-network

  # ----------------------------------------------------------------------------
  # 4. BACKEND REST API (SPRING BOOT) - PROFILE OPCIONAL
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: rewit-backend
    restart: unless-stopped
    profiles:
      - backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET}
      ACCOUNT_EMAIL_RESERVATION_SECRET: ${ACCOUNT_EMAIL_RESERVATION_SECRET}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - rewit-network

  # ----------------------------------------------------------------------------
  # 5. TÚNEL CLOUDFLARE (ACESSO VIA CELULAR FÍSICO) - PROFILE OPCIONAL
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rewit-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - rewit-network
